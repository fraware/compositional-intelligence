name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout publication sources
        uses: actions/checkout@v4
      - name: Configure fixed Pandoc version
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.13'
      - name: Check Python syntax
        run: python3 -m py_compile scripts/build_site.py scripts/verify_site.py scripts/verify_notation.py scripts/render_science.py scripts/render_preface.py scripts/render_semantic.py scripts/render_typed.py scripts/render_functorial.py scripts/render_lambek.py scripts/render_algebraic.py scripts/render_quantitative.py scripts/render_effectful.py scripts/audit_layout.py scripts/check_originals.py
      - name: Test source-bound publication metadata
        run: python3 -m unittest discover -s scripts -p 'test_publication.py' -v
      - name: Build website twice and verify reproducibility
        run: python3 scripts/build_site.py --output _site --reproducibility-check
      - name: Validate publication integrity and navigation
        run: python3 scripts/verify_site.py
      - name: Audit all displayed notation and records
        run: python3 scripts/verify_notation.py
      - name: Install Chromium for browser QA
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Test desktop and mobile layout
        run: python3 scripts/audit_layout.py _site --screenshots _qa
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-layout-qa
          path: _qa/
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
