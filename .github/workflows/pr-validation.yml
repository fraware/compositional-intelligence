name: Validate publication pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout manuscript and publication sources
        uses: actions/checkout@v4
      - name: Configure exact Pandoc version
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.13'
      - name: Verify Python syntax
        run: python3 -m compileall -q scripts
      - name: Check manuscript fidelity and discovery metadata
        run: python3 -m unittest discover -s scripts -p 'test_publication.py' -v
      - name: Build reproducibly
        run: python3 scripts/build_site.py --output _site --reproducibility-check
      - name: Check published HTML and internal links
        run: python3 scripts/verify_site.py
      - name: Audit scientific notation and source consistency
        run: python3 scripts/verify_notation.py
      - name: Install Chromium and PDF tooling
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0 pypdf==5.9.0
          python3 -m playwright install --with-deps chromium
      - name: Test reading layout
        run: python3 scripts/audit_layout.py _site --screenshots _qa
      - name: Test typed generation layouts and print
        run: python3 scripts/audit_typed_layout.py _site --screenshots _qa
      - name: Test quantitative layouts and print
        run: python3 scripts/audit_quantitative_layout.py _site --screenshots _qa
      - name: Test agent-action layouts and print
        run: python3 scripts/audit_effectful_layout.py _site --screenshots _qa
      - name: Check collection-wide layout and print
        run: python3 scripts/audit_collection_layout.py _site --screenshots _qa
